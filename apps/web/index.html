<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MMC — Manage My Clinic. Clinical dashboard, patient records, and clinic management." />
    <title>MMC — Clinical Management</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Fonts: preload to avoid render-blocking -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.1.0/index.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/index.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.1.0/index.min.css" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/index.min.css" />
    </noscript>

    <!-- Inline critical CSS for instant skeleton -->
    <style>
      body { margin: 0; background: #0f1729; font-family: system-ui, -apple-system, sans-serif; }
      #root:empty {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: '';
        width: 40px; height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
